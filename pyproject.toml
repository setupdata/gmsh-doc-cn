[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmsh-doc-cn"
version = "0.1.0"
description = "Deterministic localization pipeline for the Gmsh Chinese manual"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.scripts]
gmsh-doc-cn = "gmsh_doc_cn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
